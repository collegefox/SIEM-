$('rl').innerHTML=R.map(x=>`<div class="al"><b>${({ip:'🚫 حظر IP',host:'🔒 عزل جهاز',user:'👤 تعطيل حساب'})[x.k]}: ${esc(x.t)}</b> <span class="${x.pts>0?'ok':'no'}">(${x.pts>0?'+':''}${x.pts})</span><br>${x.msg}</div>`).join('')+(R.length?`<p>صافي نقاط الاستجابة: <b>${s}</b>${n>=3?' — 🎯 تم احتواء الحادث بالكامل (IP + جهاز + حساب)':''}. تظهر الإجراءات في Discover بالمصدر soar (ابحث <code>src:soar</code>).</p>`:'<p class="kp">لم تنفّذ أي إجراء بعد.</p>')}
setInterval(()=>{const e=$('sla');if(e&&st.tab=='a')e.textContent=slaT(st.cur)},1000);
function GT(i){const E=EV(i).filter(e=>e.atk),f=E[0],l=E[E.length-1];return{A:'198.51.100.'+(20+i),H:Hs[i%7],U:Us[i%6],t1:tm(f.t).slice(11),t2:tm(l.t).slice(11),d:S[i][3][S[i][3].length-1][0]-S[i][3][0][0]}}
function mn(s){const a=String(s).trim().split(':').map(Number);return(a.length<2||a.some(isNaN))?NaN:a[0]*60+a[1]}
function rs(){const i=st.cur;['a','al','r','rev','t0','tt','bn','rp','n'].forEach(k=>{if(st[k])delete st[k][i]});save();sc();side();main()}
function sx(){const i=st.cur,g=GT(i),v=n=>$('x'+n).value.trim(),mm=s=>mn(s.slice(0,5));
const ok=[v(1)==g.A,v(2)==g.H,v(3)==g.U,Math.abs(mn(v(4))-mm(g.t1))<=2,Math.abs(mn(v(5))-mm(g.t2))<=2],t=v(6).length>=40,r=v(7).length>=40;
(st.rp=st.rp||{})[i]={pts:ok.filter(x=>x).length*5+(t?5:0)+(r?5:0),ok,t,r,f:[1,2,3,4,5,6,7].map(n=>v(n))};save();sc();vx()}
function vx(){const i=st.cur,rp=(st.rp=st.rp||{})[i],g=GT(i),s=S[i],R=((st.r||{})[i]||[]).filter(x=>x.k!='fx');
if(!rp){$('v').innerHTML=`<p class="kp">اكتب تقرير الحادث كما يُطلب من محلل SOC بعد الانتهاء من التحقيق والاستجابة. تُقيَّم الحقول الخمسة الأولى تلقائيًا (5 نقاط لكل حقل، وللأوقات هامش ± دقيقتين)، ويُمنح 5 نقاط إضافية لكل من السبب الجذري والتوصيات إذا كُتبا بوضوح (40 حرفًا فأكثر). بعد الإرسال يظهر التقرير النموذجي للمقارنة.</p><div class="al"><label>1) عنوان IP الخاص بالمهاجم</label><input type="text" id="x1"><label>2) الجهاز المصاب</label><select id="x2">${Hs.map(h=>`<option>${h}</option>`).join('')}</select><label>3) الحساب المستخدم في الهجوم</label><select id="x3">${Us.map(u=>`<option>${u}</option>`).join('')}</select><label>4) وقت أول نشاط للمهاجم (HH:MM)</label><input type="text" id="x4" placeholder="09:05"><label>5) وقت خروج المهاجم (HH:MM)</label><input type="text" id="x5" placeholder="09:50"><label>6) السبب الجذري وكيف بدأ الحادث</label><textarea id="x6" rows="3"></textarea><label>7) التوصيات لمنع التكرار</label><textarea id="x7" rows="3"></textarea><p><button class="b" onclick="sx()">إرسال التقرير</button></p></div>`;return}
const L=['عنوان IP المهاجم','الجهاز المصاب','الحساب المستخدم','وقت أول نشاط','وقت خروج المهاجم'],M=[g.A,g.H,g.U,g.t1,g.t2];
$('v').innerHTML=`<div class="al"><b>نتيجة تقريرك: ${rp.pts} / 35</b>`+L.map((l,k)=>`<div>${rp.ok[k]?'<span class="ok">✔</span>':'<span class="no">✘</span>'} ${l}: <bdi>${esc(rp.f[k]||'—')}</bdi>${rp.ok[k]?'':' ← الصحيح: <bdi>'+M[k]+'</bdi>'}</div>`).join('')+`<div>${rp.t?'<span class="ok">✔</span>':'<span class="no">✘</span>'} السبب الجذري ${rp.t?'':'(قصير جدًا)'}</div><div>${rp.r?'<span class="ok">✔</span>':'<span class="no">✘</span>'} التوصيات ${rp.r?'':'(قصيرة جدًا)'}</div></div>
<div class="al"><b>📄 التقرير النموذجي للحادث</b><p><b>الملخص:</b> ${s[0]} — ${s[1]} استهدف الجهاز <bdi>${g.H}</bdi> باستخدام الحساب <bdi>${g.U}</bdi> من العنوان <bdi>${g.A}</bdi>.</p><p><b>الجدول الزمني:</b></p><div style="direction:ltr;text-align:left;font:12px/1.7 monospace">${EV(i).filter(e=>e.atk).map(e=>tm(e.t).slice(11)+' ['+PH[e.ph]+'] '+esc(e.msg)).join('<br>')}</div><p><b>مدة بقاء المهاجم:</b> ${g.d} دقيقة (من ${g.t1} إلى ${g.t2})</p><p><b>مؤشرات الاختراق (IOCs):</b> <bdi>IP ${g.A}</bdi> · <bdi>host ${g.H}</bdi> · <bdi>user ${g.U}</bdi></p><p><b>السبب الجذري:</b> ${s[1]}</p><p><b>الاحتواء والتوصيات:</b> ${s[2]}</p><p><b>إجراءات الاستجابة التي نفّذتها:</b> ${R.length?R.map(x=>'<bdi>'+esc(x.t)+'</bdi> ('+(x.pts>0?'+':'')+x.pts+')').join('، '):'لم تنفّذ أي إجراء (راجع تبويب الاستجابة)'}</p></div>
<div class="al"><b>تقريرك المكتوب</b><p><b>السبب الجذري:</b> ${esc(rp.f[5])||'—'}</p><p><b>التوصيات:</b> ${esc(rp.f[6])||'—'}</p></div>`}
function vq(){const i=st.cur,a=st.a[i]||[],qq=Q(i);let h='<p class="kp">أجب عن الأسئلة بعد تحليل السجلات وحركة الشبكة. المحاولة الأولى هي التي تُحتسب (25 نقطة لكل سؤال).</p>';
qq.forEach((q,k)=>{const dn=a[k]!==undefined&&a[k]!==null;h+=`<div class="q"><b>${k+1}. ${q.t}</b>`;
if(q.o)h+=q.o.map((o,j)=>`<button class="o" ${dn?'disabled':''} onclick="ans(${k},${j})">${(dn&&j==q.c)?'✅ ':''}${o}</button>`).join('');
else h+=`<div style="display:flex;gap:6px;margin:6px 0"><input type="${q.ip?'text':'number'}" id="i${k}" ${dn?'disabled':''}><button class="b" ${dn?'disabled':''} onclick="ans(${k},$('i${k}').value)">تحقق</button></div>`;
if(dn)h+=`<div class="${a[k]?'ok':'no'}">${a[k]===1?'✔ إجابة صحيحة':'✘ إجابة غير صحيحة — الصحيح: '+(q.o?q.o[q.c]:(q.ip||q.n))}</div>`;h+='</div>'});
const all=[0,1,2,3].every(k=>a[k]===0||a[k]===1);
h+=`<p><button class="b" ${all?'':'disabled'} onclick="rv()">🔴 كشف الخط الزمني الكامل للهجوم</button></p>`;
if(st.rev[i]){h+='<div class="kc"><b>سلسلة الهجوم (Kill Chain) كما حدثت:</b>'+EV(i).filter(e=>e.atk).map(e=>`<div><b>${tm(e.t).slice(11)}</b> · ${PH[e.ph]}<br>${esc(e.src)}: ${esc(e.msg)}</div>`).join('')+'</div>'}
$('v').innerHTML=h}
function ans(k,v){const i=st.cur,q=Q(i)[k],a=st.a[i]=st.a[i]||[];let ok=q.o?v===q.c:q.ip?String(v).trim()===q.ip:Math.abs(+v-q.n)<=3;if(v===''||v===undefined)return;a[k]=ok?1:0;save();sc();vq()}
function rv(){st.rev[st.cur]=1;save();sc();side();vq()}
side();main();sc();
</script></body></html>
